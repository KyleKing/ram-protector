
version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/sys-guardian
    id: sys-guardian
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    # kern.memorystatus_level, SIGSTOP semantics, and launchd are macOS-only.
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    binary: sys-guardian

archives:
  - id: sys-guardian
    formats: [binary]
    name_template: "sys-guardian-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  draft: false
  prerelease: auto

homebrew_casks:
  - name: sys-guardian
    # Pushed over SSH with a deploy key scoped to the tap repo, since GitHub
    # offers no API to mint PATs; provisioned by scripts/provision-tap-deploy-key.sh.
    repository:
      owner: kyleking
      name: homebrew-tap
      git:
        url: git@github.com:kyleking/homebrew-tap.git
        private_key: '{{ envOrDefault "TAP_DEPLOY_KEY" "" }}'
    homepage: https://github.com/kyleking/sys-guardian
    description: "Prevents CPU- and memory-hungry processes from crashing a Mac"
    # Without the TAP_DEPLOY_KEY secret the tap push is skipped with a warning
    # and the rest of the release still publishes, so a project that has not
    # been provisioned yet needs no config change here.
    skip_upload: '{{ if isEnvSet "TAP_DEPLOY_KEY" }}auto{{ else }}true{{ end }}'
    # The binaries are unsigned; clear the quarantine bit so macOS will run them.
    hooks:
      post:
        install: |
          Dir.glob(File.join(staged_path, "sys-guardian*")).each do |f|
            system_command "/usr/bin/xattr", args: ["-c", f], must_succeed: false
          end
